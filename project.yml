name: MiniHello

options:
  bundleIdPrefix: com.cn888
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  MiniHello:
    type: application
    platform: iOS
    sources:
      - path: MiniHello
    info:
      path: MiniHello/Info.plist
      properties:
        CFBundleDisplayName: MiniHello
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
